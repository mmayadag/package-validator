services:
  api:
    build: ./api
    env_file: .env
    expose:
      - "3288"
    volumes:
      # SQLite database with the report subscriptions
      - api-data:/app/data
    restart: unless-stopped

  ui:
    build: ./ui
    ports:
      - "${UI_PORT:-8080}:80"
    depends_on:
      api:
        # the api image defines a HEALTHCHECK on GET /health
        condition: service_healthy
    restart: unless-stopped

volumes:
  api-data:
