name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  lint:
    name: Format and lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci --no-audit --no-fund
      - run: npm run format:check
      - run: npm run lint

  api:
    name: API
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci --no-audit --no-fund
      - run: npm run build:contracts
      - run: npm run typecheck --workspace api
      - run: npm test --workspace api
      - run: npm run test:e2e --workspace api
      - run: npm run build --workspace api

  ui:
    name: UI
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci --no-audit --no-fund
      - run: npm run build:contracts
      - run: npm run check --workspace ui
      - run: npm test --workspace ui
      - run: npm run build --workspace ui

  docker:
    name: Docker images
    runs-on: ubuntu-latest
    needs: [api, ui]
    steps:
      - uses: actions/checkout@v7
      - run: cp .env.example .env
      - run: docker compose build

  smoke:
    name: Browser smoke test
    runs-on: ubuntu-latest
    needs: [docker]
    # Talks to the real GitHub API, so it only runs when the repository has a TOKEN secret.
    env:
      TOKEN: ${{ secrets.TOKEN }}
    steps:
      - uses: actions/checkout@v7
      - name: Skip without a GitHub token
        if: env.TOKEN == ''
        run: echo "TOKEN secret not set; skipping the smoke test"
      - uses: actions/setup-node@v7
        if: env.TOKEN != ''
        with:
          node-version-file: .nvmrc
          cache: npm
      - if: env.TOKEN != ''
        run: npm ci --no-audit --no-fund
      - if: env.TOKEN != ''
        run: npx playwright install --with-deps chromium
      - if: env.TOKEN != ''
        run: |
          cp .env.example .env
          sed -i "s|^TOKEN=.*|TOKEN=$TOKEN|" .env
          docker compose up -d --build --wait
      - if: env.TOKEN != ''
        run: npm run test:smoke
      - if: always() && env.TOKEN != ''
        run: docker compose down
