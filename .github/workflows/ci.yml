name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  api:
    name: API
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci --no-audit --no-fund
      - run: npm run build:contracts
      - run: npm run lint --workspace api
      - run: npm run typecheck --workspace api
      - run: npm test --workspace api
      - run: npm run test:e2e --workspace api
      - run: npm run build --workspace api

  ui:
    name: UI
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci --no-audit --no-fund
      - run: npm run build:contracts
      - run: npm run check --workspace ui
      - run: npm test --workspace ui
      - run: npm run build --workspace ui

  docker:
    name: Docker images
    runs-on: ubuntu-latest
    needs: [api, ui]
    steps:
      - uses: actions/checkout@v7
      - run: cp .env.example .env
      - run: docker compose build
