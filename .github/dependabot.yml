version: 2

updates:
  # One npm workspace: the root lockfile covers api, ui and packages/contracts.
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 5
    labels: ['type: chore']
    commit-message:
      prefix: 'chore(deps)'
      prefix-development: 'chore(deps-dev)'
    ignore:
      # TypeScript 7.0 ships only tsc; the compiler API the toolchain needs returns in 7.1
      - dependency-name: typescript
        update-types: ['version-update:semver-major']
    groups:
      nestjs:
        patterns: ['@nestjs/*']
      svelte:
        patterns: ['svelte', 'svelte-check', '@sveltejs/*', '@tsconfig/svelte']
      tooling:
        dependency-type: development

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
    labels: ['type: chore', 'area: infra']
    commit-message:
      prefix: 'ci(deps)'
    groups:
      actions:
        patterns: ['*']

  - package-ecosystem: docker
    directories: [/api, /ui]
    schedule:
      interval: weekly
      day: monday
    labels: ['type: chore', 'area: infra']
    commit-message:
      prefix: 'chore(docker)'
